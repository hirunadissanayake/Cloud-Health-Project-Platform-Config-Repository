spring:
  datasource:
    url: ${PATIENT_DB_URL:jdbc:postgresql://localhost:5432/healthcare_patients}
    username: ${PATIENT_DB_USERNAME:healthcare}
    password: ${PATIENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${PATIENT_DB_POOL_SIZE:10}
      minimum-idle: ${PATIENT_DB_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s
